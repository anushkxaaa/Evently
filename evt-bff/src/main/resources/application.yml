server:
  port: 8080

evt-open-service:
  url: http://localhost:8081

spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 3000
      circuitbreaker:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      openServiceClient:
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-closed-enabled: true