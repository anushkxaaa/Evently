databaseChangeLog:
  - changeSet:
      id: 001-create-event-table
      author: anush
      changes:
        - createTable:
            tableName: event
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: organizer_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: organizer_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: organizer_mobile
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_event_organizer_mobile
              - column:
                  name: city
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: banner_image_key
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: created_on
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: modified_on
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false