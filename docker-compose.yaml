services:

  postgres:
    image: postgres:18
    container_name: evently
    restart: unless-stopped

    environment:
      POSTGRES_USER: evently
      POSTGRES_PASSWORD: evently
      POSTGRES_DB: evently

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - evently-net


  kafka:
    image: apache/kafka:3.7.2
    container_name: evently-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"


    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://evently-kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@evently-kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    networks:
      - evently-net


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: evently-kafka-ui
    restart: unless-stopped

    depends_on:
      - kafka

    ports:
      - "8085:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: evently
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: evently-kafka:29092

    networks:
      - evently-net


  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: evently-connect
    restart: unless-stopped

    depends_on:
      - kafka
      - postgres

    ports:
      - "8083:8083"

    environment:
      GROUP_ID: 1

      BOOTSTRAP_SERVERS: evently-kafka:29092

      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status

      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KAFKA_CONNECT_PLUGINS_DIR: /kafka/connect

      DEBEZIUM_VERSION: 2.7.3.Final

    networks:
      - evently-net


  mongo:
    image: mongo:latest
    container_name: evently-mongo
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb

    networks:
      - evently-net


  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: evently-keycloak
    restart: unless-stopped

    command: start-dev

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

    ports:
      - "8081:8080"

    networks:
      - evently-net


networks:
  evently-net:
    external: true


volumes:

  postgres_data:
    external: true
    name: 0245a73b77a094dac62804e4cdf5f23abd08df46088c8186f1a0d1b588bea61a

  mongo_data:
    external: true
    name: ca864922c7d6eb01ec55625eabdc449fa4cd470dca1ac3da633343e91760a0c0

  mongo_config:
    external: true
    name: 9d5ed7c65a60fd8456feac016978c8fd172efdfe9762c162bd5e85de12649f40