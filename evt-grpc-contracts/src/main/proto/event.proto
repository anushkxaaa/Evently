syntax = "proto3";

package com.evently.grpc;

option java_multiple_files = true;
option java_package = "com.evently.grpc";
option java_outer_classname = "EventProto";

import "google/protobuf/timestamp.proto";

// ---------- Enums ----------

enum EventCategory {
  EVENT_CATEGORY_UNSPECIFIED = 0;
  EVENT_CATEGORY_MUSIC = 1;
  EVENT_CATEGORY_SPORTS = 2;
  EVENT_CATEGORY_COMEDY = 3;
  EVENT_CATEGORY_WORKSHOP = 4;
  EVENT_CATEGORY_OTHER = 5;
}

enum EventStatus {
  EVENT_STATUS_UNSPECIFIED = 0;
  EVENT_STATUS_DRAFT = 1;
  EVENT_STATUS_PUBLISHED = 2;
  EVENT_STATUS_CANCELLED = 3;
  EVENT_STATUS_SOLD_OUT = 4;
}

// ---------- Core message ----------

message Event {
  string id = 1;
  string event_name = 2;
  string organizer_id = 3;
  string organizer_name = 4;
  string organizer_mobile = 5;
  string city = 6;
  EventCategory category = 7;
  EventStatus status = 8;
  string banner_image_key = 9;
  google.protobuf.Timestamp created_on = 10;
  google.protobuf.Timestamp modified_on = 11;
}

// ---------- CreateEvent ----------

message CreateEventRequest {
  string event_name = 1;
  string organizer_id = 2;
  string organizer_name = 3;
  string organizer_mobile = 4;
  string city = 5;
  EventCategory category = 6;
}

message CreateEventResponse {
  Event event = 1;
}

// ---------- GetEvent ----------

message GetEventRequest {
  string id = 1;
}

message GetEventResponse {
  Event event = 1;
}

// ---------- ListEvents ----------

message ListEventsRequest {
  string city = 1;
  EventCategory category = 2;
  EventStatus status = 3;
  bool include_cancelled = 4;
  int32 page = 5;
  int32 size = 6;
}

message ListEventsResponse {
  repeated Event events = 1;
  int64 total_elements = 2;
  int32 total_pages = 3;
}

// ---------- UpdateEventStatus ----------

message UpdateEventStatusRequest {
  string id = 1;
  EventStatus new_status = 2;
}

message UpdateEventStatusResponse {
  Event event = 1;
}

// ---------- GetEventStats ----------

message GetEventStatsRequest {
}

message CategoryCount {
  EventCategory category = 1;
  int64 count = 2;
}

message StatusCount {
  EventStatus status = 1;
  int64 count = 2;
}

message GetEventStatsResponse {
  int64 total_events = 1;
  repeated StatusCount by_status = 2;
  repeated CategoryCount by_category = 3;
}

// ---------- Service ----------

service EventService {
  rpc CreateEvent(CreateEventRequest) returns (CreateEventResponse);
  rpc GetEvent(GetEventRequest) returns (GetEventResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc UpdateEventStatus(UpdateEventStatusRequest) returns (UpdateEventStatusResponse);
  rpc GetEventStats(GetEventStatsRequest) returns (GetEventStatsResponse);
}